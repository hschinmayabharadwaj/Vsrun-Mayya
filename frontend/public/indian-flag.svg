<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 60" fill="none">
  <!-- Indian National Flag - Tiranga -->
  <!-- Saffron -->
  <rect x="0" y="0" width="90" height="20" fill="#FF9933"/>
  <!-- White -->
  <rect x="0" y="20" width="90" height="20" fill="#FFFFFF"/>
  <!-- Green -->
  <rect x="0" y="40" width="90" height="20" fill="#138808"/>
  <!-- Ashoka Chakra -->
  <circle cx="45" cy="30" r="7" stroke="#000080" stroke-width="1.2" fill="none"/>
  <circle cx="45" cy="30" r="1.5" fill="#000080"/>
  <!-- Spokes (24 simplified to 12) -->
  <g stroke="#000080" stroke-width="0.6">
    <line x1="45" y1="23" x2="45" y2="25"/>
    <line x1="45" y1="35" x2="45" y2="37"/>
    <line x1="38" y1="30" x2="40" y2="30"/>
    <line x1="50" y1="30" x2="52" y2="30"/>
    <line x1="40.1" y1="25.1" x2="41.5" y2="26.5"/>
    <line x1="48.5" y1="33.5" x2="49.9" y2="34.9"/>
    <line x1="49.9" y1="25.1" x2="48.5" y2="26.5"/>
    <line x1="41.5" y1="33.5" x2="40.1" y2="34.9"/>
    <line x1="45" y1="23.5" x2="43.5" y2="25"/>
    <line x1="45" y1="36.5" x2="46.5" y2="35"/>
    <line x1="38.5" y1="30" x2="40" y2="28.5"/>
    <line x1="51.5" y1="30" x2="50" y2="31.5"/>
  </g>
</svg>
