<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#FFAB40"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="48" height="48" rx="12" fill="url(#logo-grad)"/>
  <!-- Government building / pillar icon -->
  <g transform="translate(24,24)">
    <!-- Pediment (roof triangle) -->
    <path d="M-14-2 L0-12 L14-2 Z" fill="white" fill-opacity="0.95"/>
    <!-- Frieze (top bar) -->
    <rect x="-13" y="-2" width="26" height="3" rx="0.5" fill="white" fill-opacity="0.95"/>
    <!-- Pillars -->
    <rect x="-11" y="1" width="3" height="11" rx="0.8" fill="white" fill-opacity="0.9"/>
    <rect x="-4" y="1" width="3" height="11" rx="0.8" fill="white" fill-opacity="0.9"/>
    <rect x="1" y="1" width="3" height="11" rx="0.8" fill="white" fill-opacity="0.9"/>
    <rect x="8" y="1" width="3" height="11" rx="0.8" fill="white" fill-opacity="0.9"/>
    <!-- Base -->
    <rect x="-14" y="12" width="28" height="3" rx="0.8" fill="white" fill-opacity="0.95"/>
    <!-- Steps -->
    <rect x="-12" y="15" width="24" height="1.5" rx="0.5" fill="white" fill-opacity="0.6"/>
  </g>
</svg>
