<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="48" height="48" rx="10" fill="url(#logo-grad)"/>
  <!-- Government building with pillars -->
  <g transform="translate(24,22)">
    <!-- Roof / pediment -->
    <path d="M-12-6 L0-13 L12-6 Z" fill="white" fill-opacity="0.95"/>
    <!-- Top bar -->
    <rect x="-11" y="-6" width="22" height="2.5" rx="0.5" fill="white" fill-opacity="0.95"/>
    <!-- Pillars -->
    <rect x="-9" y="-3.5" width="2.5" height="10" rx="0.6" fill="white" fill-opacity="0.9"/>
    <rect x="-3.5" y="-3.5" width="2.5" height="10" rx="0.6" fill="white" fill-opacity="0.9"/>
    <rect x="1" y="-3.5" width="2.5" height="10" rx="0.6" fill="white" fill-opacity="0.9"/>
    <rect x="6.5" y="-3.5" width="2.5" height="10" rx="0.6" fill="white" fill-opacity="0.9"/>
    <!-- Base -->
    <rect x="-12" y="6.5" width="24" height="2.5" rx="0.6" fill="white" fill-opacity="0.95"/>
    <!-- Steps -->
    <rect x="-10" y="9" width="20" height="1.5" rx="0.4" fill="white" fill-opacity="0.6"/>
  </g>
  <!-- Small Ashoka Chakra at bottom -->
  <circle cx="24" cy="42" r="3" stroke="white" stroke-width="0.8" fill="none" opacity="0.7"/>
  <circle cx="24" cy="42" r="0.8" fill="white" opacity="0.7"/>
</svg>
